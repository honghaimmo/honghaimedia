<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanh toán — HỒNG HẢI MMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.co-wrap{max-width:1200px;margin:0 auto;padding:30px 28px 60px}
.co-grid{display:grid;grid-template-columns:1fr 400px;gap:28px;align-items:start}
.co-card{
  background:var(--bg-glass);backdrop-filter:blur(12px);
  border:1px solid var(--border-glass);border-radius:var(--radius-lg);
  padding:24px;margin-bottom:20px;
}
.co-card h3{font-family:'Space Grotesk',sans-serif;font-size:1.15rem;margin-bottom:20px;display:flex;align-items:center;gap:10px}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--gradient-aurora);color:#05060a;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.pay-methods{display:grid;gap:10px}
.pay-method{
  display:flex;align-items:center;gap:12px;padding:14px;
  background:rgba(255,255,255,0.03);border:2px solid var(--border-glass);
  border-radius:12px;cursor:pointer;transition:var(--transition);
}
.pay-method:hover{border-color:rgba(0,240,255summary,0.4)}
.pay-method.selected{border-color:var(--neon-cyan);background:rgba(0,240,255,0.05)}
.pay-method input{accent-color:var(--neon-cyan);cursor:pointer}
.pay-icon{font-size:1.4rem}
.pay-info{flex:1}
.pay-name{font-weight:600;font-size:.92rem;margin-bottom:2px}
.pay-desc{font-size:.78rem;color:var(--text-muted)}
.balance-box{padding:14px;background:rgba(0,240,255,0.05);border:1px solid rgba(0,240,255,0.2);border-radius:10px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;font-size:.9rem}
.balance-box strong{color:var(--neon-cyan);font-family:'Space Grotesk',sans-serif}
.summary-list{display:grid;gap:10px;margin-bottom:16px;max-height:240px;overflow-y:auto;padding-right:6px}
.summary-item{display:flex;justify-content:space-between;font-size:.85rem;padding:8px 0;border-bottom:1px dashed var(--border-glass)}
.summary-item:last-child{border-bottom:none}
.summary-name{color:var(--text-secondary);flex:1}
.summary-qty{color:var(--neon-cyan);font-weight:600;margin:0 10px}
.summary-price{color:var(--text-primary);font-weight:600;white-space:nowrap}
.summary-total{border-top:1px solid var(--border-glass);padding-top:14px;margin-top:8px;display:flex;justify-content:space-between;font-size:1.05rem;font-weight:700}
.summary-total .price{color:var(--neon-cyan);font-family:'Space Grotesk',sans-serif;font-size:1.5rem}
@media(max-width:900px){
  .co-grid{grid-template-columns:1fr}
  .co-wrap{padding:20px 16px 40px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <div class="logo-mark">H3</div>
      <div class="logo-text">HỒNG HẢI <span>MMO ENTERPRISE 2026</span></div>
    </a>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Đổi giao diện">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a href="cart.html" class="icon-btn" aria-label="Giỏ hàng">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span class="badge" id="cartBadge">0</span>
      </a>
    </div>
  </div>
</header>

<div class="co-wrap">
  <h1 class="section-title" style="margin-bottom:24px">Thanh <span class="accent">toán</span></h1>

  <div class="co-grid">
    <div>
      <div class="co-card">
        <h3><span class="step-num">1</span> Thông tin liên hệ</h3>
        <div class="form-group">
          <label class="form-label">Họ tên <span class="req">*</span></label>
          <input type="text" class="form-input" id="fullname" placeholder="Nguyễn Văn A">
        </div>
        <div class="form-group">
          <label class="form-label">Email <span class="req">*</span></label>
          <input type="email" class="form-input" id="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Số điện thoại</label>
          <input type="tel" class="form-input" id="phone" placeholder="0901234567">
        </div>
      </div>

      <div class="co-card">
        <h3><span class="step-num">2</span> Phương thức thanh toán</h3>
        <div class="balance-box">
          <span>Số dư ví khả dụng:</span>
          <strong id="walletBalance">— ₫</strong>
        </div>
        <div class="pay-methods">
          <label class="pay-method selected">
            <input type="radio" name="pay" value="wallet" checked onchange="selectPay(this)">
            <span class="pay-icon">💳</span>
            <div class="pay-info">
              <div class="pay-name">Thanh toán bằng ví HỒNG HẢI MMO</div>
              <div class="pay-desc">Khấu trừ trực tiếp từ số dư ví</div>
            </div>
          </label>
          <label class="pay-method">
            <input type="radio" name="pay" value="bank" onchange="selectPay(this)">
            <span class="pay-icon">🏦</span>
            <div class="pay-info">
              <div class="pay-name">Chuyển khoản ngân hàng</div>
              <div class="pay-desc">Qua cổng thanh toán được xác minh</div>
            </div>
          </label>
          <label class="pay-method">
            <input type="radio" name="pay" value="momo" onchange="selectPay(this)">
            <span class="pay-icon">📱</span>
            <div class="pay-info">
              <div class="pay-name">Ví MoMo / VNPay</div>
              <div class="pay-desc">Thanh toán qua cổng điện tử</div>
            </div>
          </label>
        </div>
      </div>

      <div class="co-card">
        <h3><span class="step-num">3</span> Ghi chú đơn hàng</h3>
        <textarea class="form-textarea" id="note" placeholder="Yêu cầu đặc biệt (nếu có)"></textarea>
      </div>
    </div>

    <div>
      <div class="co-card" style="position:sticky;top:calc(var(--header-h) + 20px)">
        <h3>Đơn hàng của bạn</h3>
        <div class="-list" id="summaryList"></div>
        <div class="summary-total">
          <span>Tổng cộng</span>
          <span class="price" id="grandTotal">0₫</span>
        </div>
        <button class="btn btn-primary btn-block mt-2" onclick="placeOrder()" id="placeOrderBtn">
          Đặt hàng
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
        <p style="font-size:.75rem;color:var(--text-muted);margin-top:14px;line-height:1.5;text-align:center">
          Bằng việc đặt hàng, bạn đồng ý với <a href="terms.html" style="color:var(--neon-cyan)">Điều khoản</a> và <a href="payment-policy.html" style="color:var(--neon-cyan)">Chính sách giao dịch</a>.
        </p>
      </div>
    </div>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
/* Mock cart + ví — trong thực tế: fetch từ API */
const cart = [
  {id:'P001', name:'Thiết kế Landing Page chuyển đổi cao', price:2500000, qty:1},
  {id:'P003', name:'Dựng video TikTok viral 15s', price:450000, qty:2},
  {id:'P004', name:'Hosting Business 1 năm', price:1200000, qty:1}
];
// KHÔNG tự đặt số dư cao giả tạo. Đây chỉ là hiển thị mẫu.
const walletBalance = 0; // Trong thực tế: GET /api/wallet

function renderSummary(){
  const total = cart.reduce((s,it) => s + it.price * it.qty, 0);
  document.getElementById('summaryList').innerHTML = cart.map(it => `
    <div class="summary-item">
      <span class="summary-name">${it.name}</span>
      <span class="summary-qty">×${it.qty}</span>
      <span class="summary-price">${fmtVND(it.price * it.qty)}</span>
    </div>
  `).join('');
  document.getElementById('grandTotal').textContent = fmtVND(total);
}

function selectPay(el){
  document.querySelectorAll('.pay-method').forEach(m => m.classList.remove('selected'));
  el.closest('.pay-method').classList.add('selected');
}

function placeOrder(){
  const fullname = document.getElementById('fullname').value.trim();
  const email = document.getElementById('email').value.trim();
  if(!fullname || !email){
    showModal('Thiếu thông tin', 'Vui lòng nhập họ tên và email trước khi đặt hàng.', {icon:'⚠️'});
    return;
  }
  showModal(
    'Chưa kết nối Backend',
    'Đặt hàng cần API POST /api/orders trên máy chủ để: xác thực đăng nhập, kiểm tra số dư ví, tạo đơn với giao dịch nguyên tử và trả về mã đơn. Đây là bản frontend — KHÔNG có giao dịch thật nào được thực hiện.',
    {icon:'🔒'}
  );
}

document.addEventListener('DOMContentLoaded', () => {
  renderSummary();
  // Ví hiển thị số dư mẫu thấp (0) để nhắc rằng đây chưa phải hệ thống thật
  const b = document.getElementById('walletBalance');
  if(b) b.textContent = 'Chưa kết nối API /api/wallet';
});
</script>
</body>
</html>
