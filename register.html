<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký — HỒNG HẢI MMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.auth-wrap{min-height:calc(100vh - var(--header-h));display:grid;place-items:center;padding:40px 20px}
.auth-card{width:100%;max-width:480px;padding:40px 36px;background:var(--bg-glass);backdrop-filter:blur(20px);border:1px solid var(--border-glass);border-radius:var(--radius-xl);box-shadow:var(--shadow-neon)}
.auth-logo{display:flex;justify-content:center;margin-bottom:24px}
.auth-title{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:700;text-align:center;margin-bottom:8px;letter-spacing:-0.8px}
.auth-sub{text-align:center;color:var(--text-secondary);font-size:.9rem;margin-bottom:28px}
.auth-footer{text-align:center;margin-top:24px;font-size:.88rem;color:var(--text-secondary)}
.auth-footer a{color:var(--neon-cyan);font-weight:600}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);padding:6px}
.pw-toggle:hover{color:var(--neon-cyan)}
.input-wrap{position:relative}
.input-wrap .form-input{padding-right:44px}
.alert{padding:12px 14px;border-radius:10px;font-size:.85rem;margin-bottom:18px;display:none}
.alert.show{display:block}
.alert-error{background:rgba(255,46,196,0.1);border:1px solid rgba(255,46,196,0.3);color:var(--neon-pink)}
.alert-success{background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.3);color:var(--neon-cyan)}
.btn-loading{opacity:.7;pointer-events:none}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(5,6,10,0.3);border-top-color:#05060a;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.pw-strength{height:4px;border-radius:2px;background:rgba(255,255,255,0.1);margin-top:8px;overflow:hidden}
.pw-strength-bar{height:100%;width:0;transition:all .3s;border-radius:2px}
.pw-strength-text{font-size:.75rem;margin-top:6px;color:var(--text-muted)}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <div class="logo-mark">H3</div>
      <div class="logo-text">HỒNG HẢI <span>MMO ENTERPRISE 2026</span></div>
    </a>
    <nav class="nav">
      <a href="index.html">Trang chủ</a>
      <a href="products.html">Sản phẩm</a>
      <a href="/support">Hỗ trợ</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Đổi giao diện">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a href="login.html" class="btn btn-ghost">Đăng nhập</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html" class="logo"><div class="logo-mark">H3</div></a>
    </div>
    <h1 class="auth-title">Tạo tài khoản</h1>
    <p class="auth-sub">Bắt đầu sử dụng HỒNG HẢI MMO miễn phí</p>

    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>

    <form id="registerForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="fullname">Họ và tên <span class="req">*</span></label>
        <input type="text" id="fullname" class="form-input" placeholder="Nguyễn Văn A" autocomplete="name" required>
        <div class="form-error" id="fullnameErr"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email <span class="req">*</span></label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
        <div class="form-error" id="emailErr"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Số điện thoại</label>
        <input type="tel" id="phone" class="form-input" placeholder="0901234567" autocomplete="tel">
        <div class="form-hint">Tùy chọn, dùng để nhận thông báo đơn hàng</div>
        <div class="form-error" id="phoneErr"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu <span class="req">*</span></label>
        <div class="input-wrap">
          <input type="password" id="password" class="form-input" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" required>
          <button type="button" class="pw-toggle" onclick="togglePw('password', this)" aria-label="Hiện mật khẩu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="pw-strength"><div class="pw-strength-bar" id="pwBar"></div></div>
        <div class="pw-strength-text" id="pwText"></div>
        <div class="form-error" id="passwordErr"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password2">Nhập lại mật khẩu <span class="req">*</span></label>
        <div class="input-wrap">
          <input type="password" id="password2" class="form-input" placeholder="Nhập lại mật khẩu" autocomplete="new-password" required>
          <button type="button" class="pw-toggle" onclick="togglePw('password2', this)" aria-label="Hiện mật khẩu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="form-error" id="password2Err"></div>
      </div>

      <div class="form-group">
        <label class="form-check">
          <input type="checkbox" id="agree" required>
          <span>Tôi đồng ý với <a href="terms.html" target="_blank" style="color:var(--neon-cyan)">Điều khoản sử dụng</a> và <a href="privacy.html" target="_blank" style="color:var(--neon-cyan)">Chính sách bảo mật</a></span>
        </label>
        <div class="form-error" id="agreeErr"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Tạo tài khoản</button>
    </form>

    <p class="auth-footer">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
function togglePw(id, btn){
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

function setFieldError(id, msg){
  const err = document.getElementById(id + 'Err');
  const inp = document.getElementById(id);
  if(err){ err.textContent = msg || ''; err.classList.toggle('show', !!msg); }
  if(inp){ inp.style.borderColor = msg ? 'var(--neon-pink)' : ''; }
}

function showError(msg){
  const el = document.getElementById('errorAlert');
  el.textContent = msg;
  el.classList.add('show');
}

/* Đo độ mạnh mật khẩu */
document.getElementById('password').addEventListener('input', (e) => {
  const v = e.target.value;
  let score = 0;
  if(v.length >= 8) score++;
  if(v.length >= 12) score++;
  if(/[a-z]/.test(v) && /[A-Z]/.test(v)) score++;
  if(/\d/.test(v)) score++;
  if(/[^a-zA-Z0-9]/.test(v)) score++;

  const bar = document.getElementById('pwBar');
  const txt = document.getElementById('pwText');
  const levels = [
    {w:'0%', c:'transparent', t:''},
    {w:'25%', c:'#ff2ec4', t:'Rất yếu'},
    {w:'50%', c:'#ff9f43', t:'Yếu'},
    {w:'75%', c:'#ffd93d', t:'Trung bình'},
    {w:'100%', c:'#00f0ff', t:'Mạnh'},
    {w:'100%', c:'#00ff88', t:'Rất mạnh'}
  ];
  const lvl = levels[Math.min(score, 5)];
  bar.style.width = lvl.w;
  bar.style.background = lvl.c;
  txt.textContent = v ? 'Độ mạnh: ' + lvl.t : '';
  txt.style.color = lvl.c;
});

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fullname = document.getElementById('fullname').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  const agree = document.getElementById('agree').checked;

  ['fullname','email','phone','password','password2','agree'].forEach(id => setFieldError(id, ''));
  let ok = true;

  if(!fullname){ setFieldError('fullname', 'Vui lòng nhập họ tên'); ok = false; }
  if(!email){ setFieldError('email', 'Vui lòng nhập email'); ok = false; }
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ setFieldError('email', 'Email không hợp lệ'); ok = false; }
  if(phone && !/^0\d{9,10}$/.test(phone)){ setFieldError('phone', 'SĐT phải bắt đầu bằng 0, 10-11 số'); ok = false; }
  if(!password){ setFieldError('password', 'Vui lòng nhập mật khẩu'); ok = false; }
  else if(password.length < 8){ setFieldError('password', 'Mật khẩu tối thiểu 8 ký tự'); ok = false; }
  if(password !== password2){ setFieldError('password2', 'Mật khẩu nhập lại không khớp'); ok = false; }
  if(!agree){ setFieldError('agree', 'Bạn phải đồng ý điều khoản'); ok = false; }

  if(!ok) return;

  const btn = document.getElementById('submitBtn');
  btn.classList.add('btn-loading');
  btn.innerHTML = '<span class="spinner"></span> Đang tạo tài khoản...';

  try {
    /* ============ KHI CÓ BACKEND: BỎ COMMENT ============
    await apiFetch('/auth/register', {
      method: 'POST',
      body: JSON.stringify({ fullname, email, phone, password })
    });
    window.location.href = 'login.html?registered=1';
    return;
    */
    await new Promise(r => setTimeout(r, 800));
    showError('⚠️ Chưa kết nối backend. Đây là giao diện frontend — cần API /api/auth/register để đăng ký thật.');
  } catch(err){
    showError('Lỗi: ' + (err.message || 'Không thể đăng ký'));
  } finally {
    btn.classList.remove('btn-loading');
    btn.textContent = 'Tạo tài khoản';
  }
});
</script>
</body>
</html>
