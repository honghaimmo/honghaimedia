<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — HỒNG HẢI MMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.auth-wrap{
  min-height:calc(100vh - var(--header-h));
  display:grid;place-items:center;
  padding:40px 20px;
}
.auth-card{
  width:100%;max-width:440px;
  padding:40px 36px;
  background:var(--bg-glass);
  backdrop-filter:blur(20px);
  border:1px solid var(--border-glass);
  border-radius:var(--radius-xl);
  box-shadow:var(--shadow-neon);
}
.auth-logo{display:flex;justify-content:center;margin-bottom:24px}
.auth-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:1.8rem;font-weight:700;
  text-align:center;margin-bottom:8px;letter-spacing:-0.8px;
}
.auth-sub{
  text-align:center;color:var(--text-secondary);
  font-size:.9rem;margin-bottom:28px;
}
.auth-footer{
  text-align:center;margin-top:24px;
  font-size:.88rem;color:var(--text-secondary);
}
.auth-footer a{color:var(--neon-cyan);font-weight:600}
.auth-footer a:hover{text-decoration:underline}
.auth-divider{
  display:flex;align-items:center;gap:12px;
  margin:22px 0;color:var(--text-muted);font-size:.8rem;
}
.auth-divider::before,.auth-divider::after{
  content:'';flex:1;height:1px;background:var(--border-glass);
}
.form-row-between{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap;
}
.forgot-link{font-size:.85rem;color:var(--neon-cyan);font-weight:600}
.forgot-link:hover{text-decoration:underline}
.pw-toggle{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:var(--text-muted);padding:6px;transition:color .2s;
}
.pw-toggle:hover{color:var(--neon-cyan)}
.input-wrap{position:relative}
.input-wrap .form-input{padding-right:44px}
.alert{
  padding:12px 14px;border-radius:10px;
  font-size:.85rem;margin-bottom:18px;
  display:none;
}
.alert.show{display:block}
.alert-error{
  background:rgba(255,46,196,0.1);
  border:1px solid rgba(255,46,196,0.3);
  color:var(--neon-pink);
}
.alert-success{
  background:rgba(0,240,255,0.1);
  border:1px solid rgba(0,240,255,0.3);
  color:var(--neon-cyan);
}
.btn-loading{opacity:.7;pointer-events:none}
.spinner{
  display:inline-block;width:14px;height:14px;
  border:2px solid rgba(5,6,10,0.3);
  border-top-color:#05060a;
  border-radius:50%;
  animation:spin .6s linear infinite;
  margin-right:6px;
  vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <div class="logo-mark">H3</div>
      <div class="logo-text">HỒNG HẢI <span>MMO ENTERPRISE 2026</span></div>
    </a>
    <nav class="nav">
      <a href="index.html">Trang chủ</a>
      <a href="products.html">Sản phẩm</a>
      <a href="/categories">Danh mục</a>
      <a href="/support">Hỗ trợ</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Đổi giao diện">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a href="register.html" class="btn btn-primary">Đăng ký</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="index.html" class="logo">
        <div class="logo-mark">H3</div>
      </a>
    </div>
    <h1 class="auth-title">Đăng nhập</h1>
    <p class="auth-sub">Chào mừng trở lại HỒNG HẢI MMO</p>

    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email hoặc số điện thoại <span class="req">*</span></label>
        <input type="text" id="email" class="form-input" placeholder="you@example.com" autocomplete="username" required>
        <div class="form-error" id="emailErr"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu <span class="req">*</span></label>
        <div class="input-wrap">
          <input type="password" id="password" class="form-input" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" onclick="togglePw('password', this)" aria-label="Hiện mật khẩu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="form-error" id="passwordErr"></div>
      </div>

      <div class="form-row-between">
        <label class="form-check">
          <input type="checkbox" id="remember">
          <span>Ghi nhớ đăng nhập</span>
        </label>
        <a href="forgot-password.html" class="forgot-link">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
        Đăng nhập
      </button>
    </form>

    <div class="auth-divider">hoặc</div>

    <p class="auth-footer">
      Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
    </p>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
function togglePw(id, btn){
  const inp = document.getElementById(id);
  const type = inp.type === 'password' ? 'text' : 'password';
  inp.type = type;
  btn.setAttribute('aria-label', type === 'password' ? 'Hiện mật khẩu' : 'Ẩn mật khẩu');
}

function showError(msg){
  const el = document.getElementById('errorAlert');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('successAlert').classList.remove('show');
}

function showSuccess(msg){
  const el = document.getElementById('successAlert');
  el.textContent = msg;
  el.classList.add('show');
  document.getElementById('errorAlert').classList.remove('show');
}

function setFieldError(id, msg){
  const err = document.getElementById(id + 'Err');
  const inp = document.getElementById(id);
  if(err){
    err.textContent = msg || '';
    err.classList.toggle('show', !!msg);
  }
  if(inp){
    inp.style.borderColor = msg ? 'var(--neon-pink)' : '';
  }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  let ok = true;

  setFieldError('email', '');
  setFieldError('password', '');

  if(!email){ setFieldError('email', 'Vui lòng nhập email hoặc số điện thoại'); ok = false; }
  if(!password){ setFieldError('password', 'Vui lòng nhập mật khẩu'); ok = false; }

  if(!ok) return;

  const btn = document.getElementById('submitBtn');
  btn.classList.add('btn-loading');
  btn.innerHTML = '<span class="spinner"></span> Đang đăng nhập...';

  try {
    // ============ KHI CÓ BACKEND: BỎ COMMENT ĐOẠN DƯỚI ============
    /*
    const res = await apiFetch('/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email, password, remember: document.getElementById('remember').checked })
    });
    // res = { user: {...}, token: '...' } hoặc dùng session cookie
    window.location.href = 'account.html';
    return;
    */

    // ============ TẠM THỜI (CHƯA CÓ BACKEND) ============
    await new Promise(r => setTimeout(r, 800));
    showError('⚠️ Chưa kết nối backend. Đây là giao diện frontend — vui lòng triển khai API /api/auth/login để đăng nhập thật.');
  } catch (err) {
    showError('Lỗi: ' + (err.message || 'Không thể đăng nhập'));
  } finally {
    btn.classList.remove('btn-loading');
    btn.textContent = 'Đăng nhập';
  }
});
</script>
</body>
</html>
