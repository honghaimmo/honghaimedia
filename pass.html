<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quên mật khẩu — HỒNG HẢI MMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
.auth-wrap{min-height:calc(100vh - var(--header-h));display:grid;place-items:center;padding:40px 20px}
.auth-card{width:100%;max-width:440px;padding:40px 36px;background:var(--bg-glass);backdrop-filter:blur(20px);border:1px solid var(--border-glass);border-radius:var(--radius-xl);box-shadow:var(--shadow-neon)}
.auth-logo{display:flex;justify-content:center;margin-bottom:24px}
.auth-title{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:700;text-align:center;margin-bottom:8px;letter-spacing:-0.8px}
.auth-sub{text-align:center;color:var(--text-secondary);font-size:.9rem;margin-bottom:28px}
.auth-footer{text-align:center;margin-top:24px;font-size:.88rem;color:var(--text-secondary)}
.auth-footer a{color:var(--neon-cyan);font-weight:600}
.alert{padding:12px 14px;border-radius:10px;font-size:.85rem;margin-bottom:18px;display:none}
.alert.show{display:block}
.alert-error{background:rgba(255,46,196,0.1);border:1px solid rgba(255,46,196,0.3);color:var(--neon-pink)}
.alert-success{background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.3);color:var(--neon-cyan)}
.btn-loading{opacity:.7;pointer-events:none}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(5,6,10,0.3);border-top-color:#05060a;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <div class="logo-mark">H3</div>
      <div class="logo-text">HỒNG HẢI <span>MMO ENTERPRISE 2026</span></div>
    </a>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Đổi giao diện">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <a href="login.html" class="btn btn-ghost">Đăng nhập</a>
    </div>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><a href="index.html" class="logo"><div class="logo-mark">H3</div></a></div>
    <h1 class="auth-title">Quên mật khẩu</h1>
    <p class="auth-sub">Nhập email đã đăng ký, chúng tôi sẽ gửi link đặt lại mật khẩu</p>

    <div class="alert alert-error" id="errorAlert"></div>
    <div class="alert alert-success" id="successAlert"></div>

    <form id="forgotForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email <span class="req">*</span></label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
        <div class="form-error" id="emailErr"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Gửi link đặt lại</button>
    </form>

    <p class="auth-footer">Nhớ mật khẩu? <a href="login.html">Đăng nhập</a></p>
  </div>
</div>

<script src="assets/app.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const err = document.getElementById('emailErr');
  err.classList.remove('show');

  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    err.textContent = 'Email không hợp lệ';
    err.classList.add('show');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.classList.add('btn-loading');
  btn.innerHTML = '<span class="spinner"></span> Đang gửi...';

  try {
    /* KHI CÓ BACKEND:
    await apiFetch('/auth/forgot-password', {
      method: 'POST',
      body: JSON.stringify({ email })
    });
    */
    await new Promise(r => setTimeout(r, 800));
    const s = document.getElementById('successAlert');
    s.textContent = '⚠️ Chưa kết nối backend. Trong hệ thống thật, link đặt lại mật khẩu sẽ được gửi tới email của bạn qua API /api/auth/forgot-password.';
    s.classList.add('show');
    document.getElementById('errorAlert').classList.remove('show');
  } catch(err2){
    const e2 = document.getElementById('errorAlert');
    e2.textContent = 'Lỗi: ' + err2.message;
    e2.classList.add('show');
  } finally {
    btn.classList.remove('btn-loading');
    btn.textContent = 'Gửi link đặt lại';
  }
});
</script>
</body>
</html>
